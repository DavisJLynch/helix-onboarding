<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helix Onboarding — Submissions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#f5f7fb; --card:#fff; --ink:#0f1b2d; --muted:#5b6b82;
    --accent:#0a66c2; --border:#e3e8ef; --danger:#c2410c;
    --ok:#15803d; --helix:#0a3d62;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header {
    background:var(--helix); color:#fff; padding:14px 24px;
    display:flex; align-items:center; gap:16px;
    position:sticky; top:0; z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header img { height:32px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header .count { margin-left:auto; font-size:13px; opacity:.85; }
  header button.reload {
    background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.3);
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  header button.reload:hover { background:rgba(255,255,255,.25); }
  main { padding:24px; max-width:1400px; margin:0 auto; }
  .empty { background:var(--card); padding:40px; text-align:center; color:var(--muted); border-radius:10px; border:1px dashed var(--border); }
  .empty a { color:var(--accent); }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); font-size:13px; }
  th { background:#eef2f7; font-weight:600; color:var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:.03em; }
  tr:hover { background:#fafbfd; }
  tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.cobra { background:#dbeafe; color:#1e40af; }
  .pill.cdh { background:#dcfce7; color:#166534; }
  .pill.off { background:#f1f5f9; color:#94a3b8; }
  .actions button {
    background:transparent; border:1px solid var(--border); padding:4px 10px;
    margin-right:4px; border-radius:5px; cursor:pointer; font-size:12px;
  }
  .actions button:hover { background:#f1f5f9; }
  .actions button.del { color:var(--danger); border-color:#fecaca; }
  .actions button.del:hover { background:#fef2f2; }
  .modal-bg {
    position:fixed; inset:0; background:rgba(15,27,45,.6); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-bg.on { display:flex; }
  .modal {
    background:var(--card); border-radius:12px; max-width:960px; width:100%;
    max-height:90vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal header {
    background:#eef2f7; color:var(--ink); padding:12px 18px;
    position:static; box-shadow:none;
  }
  .modal header h2 { margin:0; font-size:15px; flex:1; }
  .modal .close {
    background:transparent; border:none; font-size:22px; cursor:pointer; color:var(--muted);
  }
  .modal .body { padding:18px; overflow:auto; flex:1; }
  pre { background:#0f1b2d; color:#c8e1ff; padding:16px; border-radius:8px; font-size:12px; overflow:auto; margin:0; }
  .err { color:var(--danger); padding:14px; background:#fef2f2; border-radius:8px; margin-bottom:14px; }
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <img src="helix-logo-white.png" alt="Helix" onerror="this.style.display='none'">
  <h1>Submissions</h1>
  <span class="count" id="count">—</span>
  <a href="/benefit-plan-setup.html" style="color:#fff;font-size:13px;opacity:.85;text-decoration:underline">New Onboarding</a>
  <button class="reload" onclick="load()">Reload</button>
  <button class="reload" onclick="signOut()">Sign Out</button>
</header>
<main>
  <div id="out"><div class="empty">Loading…</div></div>
</main>

<div class="modal-bg" id="modal" onclick="if(event.target===this)close()">
  <div class="modal">
    <header>
      <h2 id="mtitle">Submission</h2>
      <button class="close" onclick="close()">×</button>
    </header>
    <div class="body"><pre id="mjson"></pre></div>
  </div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmt(iso){ if(!iso) return '—'; try { return new Date(iso).toLocaleString(); } catch(e){ return iso; } }

async function signOut(){
  try { await fetch('/api/auth/logout', { method:'POST' }); } catch(e){}
  location.href = '/login.html';
}

async function load(){
  const out = document.getElementById('out');
  out.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch('/api/submissions');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const list = await r.json();
    document.getElementById('count').textContent = list.length+' record'+(list.length===1?'':'s');
    if(!list.length){
      out.innerHTML = '<div class="empty">No submissions yet. Submit the form at <a href="/benefit-plan-setup.html">/benefit-plan-setup.html</a> to see records here.</div>';
      return;
    }
    let html = '<table><thead><tr><th>Employer</th><th>Products</th><th>COBRA</th><th>CDH</th><th>Submitted</th><th>Size</th><th></th></tr></thead><tbody>';
    for(const s of list){
      const ob = s.onboarding || {};
      const cobraPill = ob.cobra ? `<span class="pill cobra">${s.cobraPlans||0} plan${s.cobraPlans===1?'':'s'}</span>` : '<span class="pill off">—</span>';
      const cdhPill = ob.cdh ? `<span class="pill cdh">${s.cdhPlans||0} plan${s.cdhPlans===1?'':'s'}</span>` : '<span class="pill off">—</span>';
      const products = [ob.cobra?'COBRA':null, ob.cdh?'CDH':null].filter(Boolean).join(' + ') || '<span class="muted">none</span>';
      html += `<tr>
        <td><strong>${esc(s.employerName||'(unnamed)')}</strong><br><span class="muted">${esc(s.id)}</span></td>
        <td>${products}</td>
        <td>${cobraPill}</td>
        <td>${cdhPill}</td>
        <td>${fmt(s.submittedAt||s.modified)}</td>
        <td class="muted">${(s.size/1024).toFixed(1)} KB</td>
        <td class="actions">
          <button onclick="view('${esc(s.id)}')">View</button>
          <button onclick="download('${esc(s.id)}')">JSON</button>
          <button class="del" onclick="del('${esc(s.id)}','${esc(s.employerName||s.id)}')">Delete</button>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
    out.innerHTML = html;
  } catch(e){
    out.innerHTML = '<div class="err">Failed to load: '+esc(e.message)+'</div>';
  }
}

async function view(id){
  try {
    const r = await fetch('/api/submissions/'+encodeURIComponent(id));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    document.getElementById('mtitle').textContent = id;
    document.getElementById('mjson').textContent = JSON.stringify(data, null, 2);
    document.getElementById('modal').classList.add('on');
  } catch(e){ alert('Failed: '+e.message); }
}

function download(id){
  const a = document.createElement('a');
  a.href = '/api/submissions/'+encodeURIComponent(id);
  a.download = id+'.json';
  a.click();
}

async function del(id, label){
  if(!confirm('Delete submission from "'+label+'"?\n\n'+id)) return;
  try {
    const r = await fetch('/api/submissions/'+encodeURIComponent(id), { method:'DELETE' });
    if(!r.ok) throw new Error('HTTP '+r.status);
    load();
  } catch(e){ alert('Delete failed: '+e.message); }
}

function close(){ document.getElementById('modal').classList.remove('on'); }
window.close = close;

load();
</script>
</body>
</html>
